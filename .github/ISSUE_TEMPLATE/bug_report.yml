name: Bug report
description: Something in OnCallAlert does not work as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets (API keys, phone numbers, server URLs you want private) from logs before posting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server / web UI
        - Android app
        - Notifications (SMS, voice, email, push)
        - Install / upgrade
        - Other
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version and Android version (if the app is involved)
      placeholder: e.g. app 1.0.2, Android 14, Pixel 7
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server or app logs. This is formatted as code automatically.
      render: shell
